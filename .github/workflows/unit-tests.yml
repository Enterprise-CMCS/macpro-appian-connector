name: Unit Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn test-tsc

      - name: Lambda unit tests
        run: yarn test-ci

      - name: Infra tests
        run: yarn test
        working-directory: infra
